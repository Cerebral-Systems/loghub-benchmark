[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loghub-sre-benchmark-tools"
version = "0.1.0"
description = "Internal tooling for the Loghub SRE Harbor benchmark (case-builder, exporters, leaderboard). The benchmark itself lives in tasks/."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }
authors = [
  { name = "madhav", email = "madhavgoyal007@pm.me" },
]
keywords = ["sre", "benchmark", "loghub", "harbor", "observability", "incident-response"]
classifiers = [
  "Public",
]

[project.scripts]
loghub-build-cases = "tools.case_builder.build_cases:main"
loghub-export = "tools.case_builder.export_to_harbor:main"
loghub-rebuild-curated = "tools.case_builder.rebuild_curated:main"
loghub-stress-pack = "tools.stress_pack_generator.__main__:main"
loghub-rubric-check = "tools.rubric_check.moonshot_check:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
