[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loghub-sre-benchmark-tools"
version = "0.1.0"
description = "Internal tooling for the Loghub SRE Harbor benchmark (case-builder, exporters, leaderboard). The benchmark itself lives in tasks/."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }
authors = [
  { name = "Mesh Intelligence Contributors" },
]
keywords = ["sre", "benchmark", "loghub", "harbor", "observability", "incident-response"]
classifiers = [
  "Private :: Do Not Upload",
]

[project.scripts]
loghub-benchmark = "loghub_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
